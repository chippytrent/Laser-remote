<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<title>LaserRemote</title>
<style>
  :root{
    --bg:#111418; --panel:#1b2027; --line:#2c333d; --text:#eef1f4; --muted:#8d97a3;
    --accent:#ffb020; --accent-ink:#1a1200; --ok:#3ecf8e; --bad:#ff5d5d; --blue:#4da3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--ok)} .dot.busy{background:var(--accent)}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer;color:var(--text);background:var(--panel);
    border:1px solid var(--line);padding:12px 14px;min-height:48px}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.4}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .reading{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin:14px 0}
  .reading .val{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .reading .unit{font-size:22px;color:var(--muted);margin-left:4px}
  .reading .sub{color:var(--muted);font-size:13px;min-height:18px}
  .measure{width:100%;min-height:110px;font-size:28px;font-weight:800;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:22px;letter-spacing:1px}
  .label{width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;min-height:48px}
  h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  li .n{color:var(--muted);font-size:13px;width:26px}
  li .mm{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:96px}
  li .lbl{flex:1;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li button{min-height:38px;padding:6px 10px;font-size:14px;border-radius:10px}
  .empty{color:var(--muted);text-align:center;padding:14px;font-size:14px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:18px}
  summary{cursor:pointer;color:var(--muted)}
  .log{font:12px/1.45 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px;color:#c9d1d9}
  .log .tx{color:var(--blue)} .log .rx{color:var(--ok)} .log .er{color:var(--bad)}
  .hex{flex:2;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:14px ui-monospace,Menlo,monospace}
  .small{font-size:13px;color:var(--muted);margin-top:8px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .warn{background:#3a1d1d;border:1px solid #6b2b2b;border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laser<span>Remote</span></h1>
    <div class="status"><div id="dot" class="dot"></div><span id="statusTxt">Not connected</span></div>
  </header>

  <div id="noBle" class="warn">This browser can't use Bluetooth. On iPhone/iPad, open this page in the <b>Bluefy</b> app from an https:// link.</div>

  <div class="row">
    <button id="btnConnect">Connect laser</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
  </div>

  <div class="reading">
    <div><span id="val" class="val">—</span><span class="unit">mm</span></div>
    <div id="sub" class="sub">Press the laser's button or tap Measure</div>
  </div>

  <button id="btnMeasure" class="measure" disabled>MEASURE</button>
  <input id="label" class="label" placeholder="Label for next reading (optional), e.g. W1 height" autocomplete="off">

  <div class="row" style="margin-top:10px">
    <button id="btnLaserOn" disabled>Laser on</button>
    <button id="btnLaserOff" disabled>Laser off</button>
  </div>

  <h2><span>Readings</span><span id="count">0</span></h2>
  <ul id="list"></ul>
  <div class="row" style="margin-top:6px">
    <button id="btnCopyAll">Copy all</button>
    <button id="btnCsv">Export CSV</button>
    <button id="btnClear">Clear</button>
  </div>

  <details id="dbg">
    <summary>Debug (raw Bluetooth data)</summary>
    <div class="row" style="margin-top:10px">
      <input id="hexIn" class="hex" placeholder="C0 40 00" autocomplete="off" autocapitalize="characters">
      <button id="btnSend" style="flex:1">Send</button>
    </div>
    <div class="small">Type bytes without the checksum — it's added automatically.</div>
    <div class="row" style="margin-top:8px">
      <button id="btnCopyLog">Copy log</button>
      <button id="btnClearLog">Clear log</button>
    </div>
    <div id="log" class="log"></div>
  </details>
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
  // ---- Bosch "C" series BLE details (GLM 50-27 C / 100-25 C generation) ----
  const SERVICE = '02a6c0d0-0451-4000-b000-fb3210111989';
  const CHAR    = '02a6c0d1-0451-4000-b000-fb3210111989';

  // CRC-8, poly 0xA6, init 0xAA (matches Bosch frames, e.g. C0 40 00 -> EE)
  function crc8(bytes){
    let c = 0xAA;
    for (const b of bytes){
      c ^= b;
      for (let i=0;i<8;i++) c = (c & 0x80) ? ((c<<1) ^ 0xA6) & 0xFF : (c<<1) & 0xFF;
    }
    return c;
  }
  const frame = arr => Uint8Array.from([...arr, crc8(arr)]);
  const CMD = {
    sync:     frame([0xC0,0x55,0x02,0x01,0x00]), // turn on auto-send of measurements
    measure:  frame([0xC0,0x40,0x00]),           // trigger a measurement
    laserOn:  frame([0xC0,0x41,0x00]),
    laserOff: frame([0xC0,0x42,0x00]),
  };

  // ---- UI refs ----
  const $ = id => document.getElementById(id);
  const ui = {dot:$('dot'), st:$('statusTxt'), val:$('val'), sub:$('sub'), list:$('list'), count:$('count'), log:$('log'), label:$('label')};
  const ctrl = ['btnMeasure','btnLaserOn','btnLaserOff','btnDisconnect'].map($);

  let device=null, chr=null, readings=[], lastSig='', lastAt=0;

  // ---- storage (best effort) ----
  try { readings = JSON.parse(localStorage.getItem('lr_readings')||'[]'); } catch(e){ readings=[]; }
  const save = () => { try { localStorage.setItem('lr_readings', JSON.stringify(readings)); } catch(e){} };

  // ---- helpers ----
  const hex = b => [...b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
  function log(cls, msg){
    const t = new Date().toLocaleTimeString([], {hour12:false});
    const line = document.createElement('div'); line.className = cls; line.textContent = `${t} ${msg}`;
    ui.log.prepend(line);
    while (ui.log.childNodes.length > 300) ui.log.lastChild.remove();
  }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }
  function setStatus(state, txt){
    ui.dot.className = 'dot' + (state==='on'?' on':state==='busy'?' busy':'');
    ui.st.textContent = txt;
    const on = state==='on';
    ctrl.forEach(b=>b.disabled=!on);
    $('btnConnect').disabled = state==='busy';
  }
  async function copy(text){
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy'); toast('Copied');}catch(_){toast('Copy failed');} ta.remove(); }
  }

  // ---- parsing ----
  function parse(b){
    // Remote-measure reply: 00 04 [uint32 LE, units of 0.05 mm] crc
    if (b.length >= 7 && b[0]===0x00 && b[1]===0x04){
      const v = new DataView(b.buffer, b.byteOffset).getUint32(2, true);
      return v * 0.05;
    }
    // Auto-sync notification: C0 55 10 ... float32 LE metres at offset 7
    if (b.length >= 11 && b[0]===0xC0 && b[1]===0x55 && b[2]===0x10){
      const m = new DataView(b.buffer, b.byteOffset).getFloat32(7, true);
      if (isFinite(m) && m > 0 && m < 300) return m * 1000;
    }
    return null;
  }

  function onData(ev){
    const b = new Uint8Array(ev.target.value.buffer.slice(0));
    log('rx', 'RX ' + hex(b));
    const mm = parse(b);
    if (mm == null || mm <= 0) return;
    const r = Math.round(mm);
    // ignore duplicate (same value within 600 ms — remote + sync can both report)
    const now = Date.now();
    if (String(r)===lastSig && now-lastAt < 600) return;
    lastSig = String(r); lastAt = now;
    addReading(r);
  }

  function addReading(mm){
    const lbl = ui.label.value.trim();
    readings.unshift({mm, label:lbl, t:new Date().toISOString()});
    ui.label.value = '';
    save(); render();
    ui.val.textContent = mm.toLocaleString('en-AU');
    ui.sub.textContent = (lbl ? lbl + ' · ' : '') + (mm/1000).toFixed(3) + ' m';
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function render(){
    ui.count.textContent = readings.length;
    ui.list.innerHTML = '';
    if (!readings.length){ ui.list.innerHTML = '<div class="empty">No readings yet</div>'; return; }
    readings.forEach((r,i)=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">${readings.length-i}</span><span class="mm">${r.mm.toLocaleString('en-AU')}</span><span class="lbl"></span>`;
      li.querySelector('.lbl').textContent = r.label || '';
      const bc = document.createElement('button'); bc.textContent='Copy'; bc.onclick=()=>copy(String(r.mm));
      const be = document.createElement('button'); be.textContent='✎'; be.onclick=()=>{ const v=prompt('Label', r.label||''); if(v!==null){ r.label=v.trim(); save(); render(); } };
      const bd = document.createElement('button'); bd.textContent='✕'; bd.onclick=()=>{ readings.splice(i,1); save(); render(); };
      li.append(bc, be, bd); ui.list.appendChild(li);
    });
  }

  // ---- BLE ----
  async function write(bytes){
    if (!chr) return;
    log('tx', 'TX ' + hex(bytes));
    try {
      if (chr.writeValueWithResponse) await chr.writeValueWithResponse(bytes);
      else await chr.writeValue(bytes);
    } catch(e){
      try { if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(bytes); else throw e; }
      catch(e2){ log('er','Write failed: '+e2.message); toast('Send failed'); }
    }
  }

  async function connect(){
    if (!navigator.bluetooth){ $('noBle').style.display='block'; return; }
    setStatus('busy','Searching…');
    try {
      device = await navigator.bluetooth.requestDevice({
        filters:[{namePrefix:'GLM'},{namePrefix:'Bosch'},{services:[SERVICE]}],
        optionalServices:[SERVICE]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      log('', 'Device: ' + (device.name||'(no name)'));
      setStatus('busy','Connecting…');
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(SERVICE);
      chr = await svc.getCharacteristic(CHAR);
      chr.addEventListener('characteristicvaluechanged', onData);
      await chr.startNotifications();
      setStatus('on', device.name || 'Connected');
      await write(CMD.sync);
      toast('Connected');
    } catch(e){
      log('er','Connect: '+e.message);
      setStatus('off', e.name==='NotFoundError' ? 'Not connected' : 'Failed – see Debug');
      chr = null;
    }
  }
  function onDisconnected(){ chr=null; setStatus('off','Disconnected'); log('er','Disconnected'); }
  function disconnect(){ try{ device && device.gatt.connected && device.gatt.disconnect(); }catch(e){} }

  // ---- export ----
  function csv(){
    const rows = [['#','Label','mm','Time']];
    readings.slice().reverse().forEach((r,i)=>rows.push([i+1, r.label||'', r.mm, new Date(r.t).toLocaleString('en-AU')]));
    return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  }
  async function exportCsv(){
    if (!readings.length) return toast('Nothing to export');
    const name = 'laser-readings-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.csv';
    const file = new File([csv()], name, {type:'text/csv'});
    try {
      if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
    } catch(e){ if (e.name==='AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---- wire up ----
  $('btnConnect').onclick = connect;
  $('btnDisconnect').onclick = disconnect;
  $('btnMeasure').onclick = () => write(CMD.measure);
  $('btnLaserOn').onclick = () => write(CMD.laserOn);
  $('btnLaserOff').onclick = () => write(CMD.laserOff);
  $('btnCopyAll').onclick = () => readings.length ? copy(readings.slice().reverse().map((r,i)=>`${i+1}\t${r.label||''}\t${r.mm}`).join('\n')) : toast('Nothing to copy');
  $('btnCsv').onclick = exportCsv;
  $('btnClear').onclick = () => { if (readings.length && confirm('Clear all readings?')) { readings=[]; save(); render(); ui.val.textContent='—'; } };
  $('btnSend').onclick = () => {
    const parts = $('hexIn').value.trim().split(/[\s,]+/).filter(Boolean).map(h=>parseInt(h,16));
    if (!parts.length || parts.some(n=>isNaN(n)||n<0||n>255)) return toast('Bad hex');
    write(frame(parts));
  };
  $('btnCopyLog').onclick = () => copy([...ui.log.childNodes].map(n=>n.textContent).reverse().join('\n'));
  $('btnClearLog').onclick = () => ui.log.innerHTML='';

  if (!navigator.bluetooth) $('noBle').style.display='block';
  render();
})();
</script>
</body>
</html>
